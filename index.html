<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F1E6" />
    <title>Gardendoku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- square backdrop: always covers the whole window (cropped, never letterboxed) -->
    <svg id="bg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="bg-sky" x2="0" y2="1"><stop style="stop-color:var(--sky-a)"/><stop offset=".5" style="stop-color:var(--sky-b)"/><stop offset=".72" style="stop-color:var(--sky-c)"/></linearGradient>
        <linearGradient id="bg-hill" x2="0" y2="1"><stop style="stop-color:var(--hill-2a)"/><stop offset="1" style="stop-color:var(--hill-2b)"/></linearGradient>
        <radialGradient id="bg-sun" cx=".5" cy=".5" r=".5"><stop style="stop-color:var(--sun)"/><stop offset="1" style="stop-color:var(--sun)" stop-opacity="0"/></radialGradient>
        <g id="bg-cloud" style="fill:var(--cloud)"><rect width="260" height="70" rx="35" y="30"/><circle cx="90" cy="35" r="50"/><circle cx="160" cy="45" r="38"/></g>
        <g id="bg-flower"><path d="M0 0V80" stroke="#338b47" stroke-width="10" stroke-linecap="round"/><path d="M0 62Q-55 60-48 25Q-8 22 0 62M0 75Q50 68 45 35Q8 35 0 75" fill="#53b64f" stroke="#348f42" stroke-width="4"/><g fill="#ff9fc6" stroke="#dd6a9d" stroke-width="4"><ellipse cy="-25" rx="17" ry="25"/><ellipse cy="-25" rx="17" ry="25" transform="rotate(72)"/><ellipse cy="-25" rx="17" ry="25" transform="rotate(144)"/><ellipse cy="-25" rx="17" ry="25" transform="rotate(216)"/><ellipse cy="-25" rx="17" ry="25" transform="rotate(288)"/></g><circle r="17" fill="#ffe27b" stroke="#eab63d" stroke-width="4"/></g>
      </defs>
      <rect width="1000" height="1000" fill="url(#bg-sky)"/>
      <circle cx="860" cy="130" r="240" fill="url(#bg-sun)"/>
      <use href="#bg-cloud" x="40" y="250"/>
      <use href="#bg-cloud" x="680" y="420" transform="translate(680 420) scale(.8) translate(-680 -420)"/>
      <use href="#bg-cloud" x="300" y="90" transform="translate(300 90) scale(.6) translate(-300 -90)"/>
      <path d="M0 640Q190 520 480 630T1000 590V1000H0Z" style="fill:var(--hill-1)"/>
      <path d="M0 760Q250 640 560 745T1000 690V1000H0Z" fill="url(#bg-hill)"/>
      <path d="M0 880Q380 800 1000 870V1000H0Z" style="fill:var(--hill-3)"/>
      <use href="#bg-flower" transform="translate(110 790) rotate(-12)"/>
      <use href="#bg-flower" transform="translate(890 740) rotate(13) scale(1.15)"/>
      <use href="#bg-flower" transform="translate(250 900) scale(.65)"/>
      <use href="#bg-flower" transform="translate(760 925) scale(.7) rotate(8)"/>
      <g fill="#d8f5a2"><ellipse cx="380" cy="850" rx="14" ry="5"/><ellipse cx="690" cy="800" rx="16" ry="5"/><ellipse cx="540" cy="940" rx="11" ry="5"/></g>
    </svg>

    <div id="stage">
    <div id="play-bg" aria-hidden="true"></div>
    <div id="tray-panel" aria-hidden="true"></div>
    <canvas id="game"></canvas>

    <header id="hud">
      <div class="hud-side">
        <button id="back-btn" class="icon-btn" aria-label="Back to home"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M21 7 7 20l14 13v-8h12V15H21Z" fill="#fff1b7" stroke="#547c3c" stroke-width="2.2" stroke-linejoin="round"/><path d="m18 13-8 7 8 7M22 18h8" fill="none" stroke="#fffbe0" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <div class="hud-center">
        <div id="level-name">Level 1</div>
        <div id="hearts" aria-label="Hearts left"></div>
      </div>
      <div class="hud-side right">
        <button id="settings-btn" class="icon-btn" aria-label="Settings"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m16 4 8 0 1 5 4 2 5-1 4 7-4 4v3l3 4-5 6-5-2-3 2-1 4h-8l-1-5-4-2-5 1-3-7 4-3v-4l-3-4 5-6 5 2 3-2Z" fill="#fff1b7" stroke="#547c3c" stroke-width="2.2" stroke-linejoin="round"/><circle cx="20" cy="21" r="7" fill="#91be59" stroke="#547c3c" stroke-width="2"/><path d="M16 20a4 4 0 0 1 6-3" fill="none" stroke="#d8ec9e" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>

</header>

    <!-- coin balance: only shown next to the settings button while the booster buy popup is open -->
    <div id="coin-hud" class="coin-pill hidden" aria-live="polite"><i class="coin"></i><b id="coin-count">0</b></div>

    <!-- boosters: bottom bar, under the tray scrollbar -->
    <nav id="boosters" class="hidden" aria-label="Boosters"></nav>
    <div id="boost-tip" class="hidden" role="status"></div>

    <!-- out-of-stock popup -->
    <div id="buy-pop" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="buy-title">
      <div class="buy-card"></div>
    </div>

    <!-- level 1 tutorial overlay (never blocks input) -->
    <div id="tutorial" class="hidden" aria-live="polite">
      <div id="heart-spot"></div>
      <div id="tut-from" class="tut-ring"></div>
      <div id="tut-to" class="tut-ring"></div>
      <div id="tut-hand">👆</div>
      <div id="tut-bubble">
        <svg id="tut-gardener" viewBox="0 0 88 88" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <circle cx="44" cy="45" r="38" fill="#dcebb9"/>
          <g stroke="#66543a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 85v-9c0-14 12-23 30-23s30 9 30 23v9" fill="#f5e6a6"/>
            <path d="m28 59 4 16h24l4-16M29 72h30v13H29Z" fill="#75a65c"/>
            <path d="M36 77h16v8H36Z" fill="#a8cb7b"/>
            <path d="M36 52v10q8 8 16 0V52" fill="#e9ad76"/>
            <ellipse cx="23" cy="40" rx="5" ry="7" fill="#f3c28c"/>
            <ellipse cx="65" cy="40" rx="5" ry="7" fill="#f3c28c"/>
            <path d="M24 28h40v16c0 15-10 20-20 20S24 59 24 44Z" fill="#f7cb96"/>
            <path d="M25 29v12l5-8m33-4v12l-5-8" fill="#f4f0dc"/>
            <path d="M31 38q4-3 7-1m12 0q4-2 7 1" fill="none" stroke="#eee9d6" stroke-width="3.5"/>
            <path d="M34 43v2m20-2v2" stroke="#514735" stroke-width="3"/>
            <path d="M39 55q5 5 10 0" fill="#b77352"/>
            <path d="M44 49c-7-6-11 0-13 3q8 5 13 0 5 5 13 0c-2-3-6-9-13-3Z" fill="#fff8e6" stroke="#c2b89a" stroke-width="1.3"/>
            <ellipse cx="44" cy="47" rx="4" ry="3" fill="#eeb37f" stroke="none"/>
            <path d="m23 25 5-16q16-9 32 0l5 16" fill="#f4ce6c"/>
            <path d="m25 19 38 0 2 8H23Z" fill="#7da557"/>
            <path d="M9 27q35-12 70 0c4 8-74 12-70 0Z" fill="#ffe39a"/>
            <path d="M59 15q-1-10 9-10 0 9-9 10Z" fill="#89b75d" stroke="#5b8145" stroke-width="1.5"/>
          </g>
        </svg>
        <p id="tut-text"></p>
      </div>
    </div>

    <!-- win / fail screen: art -> map -> action -->
    <div id="result" class="hidden" role="dialog" aria-modal="true" aria-label="Level result">
      <div id="res-confetti" aria-hidden="true"></div>
      <!-- kicker/sub text removed -->
      <div id="res-art" class="res-art"></div>
      <div id="res-map" class="res-map" aria-hidden="true"></div>
      <div id="res-actions" class="res-actions">
        <div id="res-reward" class="res-reward"></div>
        <button id="result-revive" class="claim-btn alt hidden"></button>
        <button id="result-btn" class="claim-btn"></button>
        <button id="result-home" class="res-home hidden" aria-label="Home"></button>
      </div>
      <div id="res-find" class="find-pop hidden" role="dialog" aria-label="New collectible"></div>
    </div>

    <!-- settings -->
    <div id="settings" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="card st-card">
        <header class="st-banner">
          <svg class="st-leaves" viewBox="0 0 100 50" aria-hidden="true"><path d="M49 47C19 48 6 30 10 10c25-3 42 11 39 37" fill="#8cdb42"/><path d="M51 47C47 19 69 2 92 6c3 24-14 42-41 41" fill="#b2ed58"/><path d="m24 23 27 25 27-29" fill="none" stroke="#549b31" stroke-width="4" stroke-linecap="round"/></svg>
          <h2 id="settings-title">SETTINGS</h2>
        </header>
        <span class="st-bolt left" aria-hidden="true"></span><span class="st-bolt right" aria-hidden="true"></span>
        <div class="st-body"><ul class="rows"><li><span class="st-ic honey" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></span><label class="st-copy" for="setting-sound"><strong>Sound</strong></label><label class="switch"><input id="setting-sound" type="checkbox" data-setting="sound" aria-label="Sound effects" /><i aria-hidden="true"></i></label></li>
<li><span class="st-ic lavender" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></svg></span><label class="st-copy" for="setting-music"><strong>Music</strong></label><label class="switch"><input id="setting-music" type="checkbox" data-setting="music" aria-label="Music" /><i aria-hidden="true"></i></label></li>
<li><span class="st-ic rose" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="16" rx="3"/><path d="M3 8v8m18-8v8M11 16h2"/></svg></span><label class="st-copy" for="setting-vibration"><strong>Vibration</strong></label><label class="switch"><input id="setting-vibration" type="checkbox" data-setting="vibration" aria-label="Vibration" /><i aria-hidden="true"></i></label></li>
<li><span class="st-ic peach" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 16h14l-2-3V9a5 5 0 0 0-10 0v4zm5 4h4M12 2v2"/></svg></span><label class="st-copy" for="setting-notifications"><strong>Notifications</strong></label><label class="switch"><input id="setting-notifications" type="checkbox" data-setting="notifications" aria-label="Notifications" /><i aria-hidden="true"></i></label></li>
<li><span class="st-ic mint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 17h6m-5 4h4M8 13a6 6 0 1 1 8 0l-1 4H9zM12 1V0M3 5 1 3m20 2 2-2"/></svg></span><label class="st-copy" for="setting-hints"><strong>Hints</strong></label><label class="switch"><input id="setting-hints" type="checkbox" data-setting="hints" aria-label="Helpful hints" /><i aria-hidden="true"></i></label></li></ul><button id="delete-account" type="button" class="st-danger">Delete account</button><p id="settings-note" class="note" role="status"></p></div>
        <button id="settings-close" class="st-close" aria-label="Close settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
    </div>

    <!-- home screen -->
    <section id="home" aria-label="Gardendoku home">
      <button id="home-shop" class="icon-btn h-gear h-shop" aria-label="Garden shop"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5C10 5 4 12 4 21c0 8 6 14 13 14 4 0 5-2 4-5-1-3 1-5 4-4 7 2 12-1 11-7C35 11 28 5 20 5Z" fill="#fff0ad" stroke="#915b26" stroke-width="2.2"/><circle cx="13" cy="14" r="3.2" fill="#f47e88"/><circle cx="22" cy="11" r="3.2" fill="#9acb50"/><circle cx="29" cy="17" r="3.2" fill="#74cbe5"/><circle cx="10" cy="23" r="3.2" fill="#c29ce7"/><path d="m26 30 7-11 3 2-6 12" fill="#b57b42" stroke="#915b26" stroke-width="1.5"/><path d="M26 29q-6 1-4 7 6 1 8-4Z" fill="#73b759" stroke="#477c38" stroke-width="1.5"/></svg></button>
      <button id="home-album" class="icon-btn h-gear h-album" aria-label="Garden album"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 8h25v27H7q-3-1-3-4V12q0-4 3-4Z" fill="#8a6ad8" stroke="#4e3a91" stroke-width="2"/><path d="M9 5h25v26H9Z" fill="#fff5ce" stroke="#6d5aa8" stroke-width="2"/><path d="M9 5h23v23H9Z" fill="#9fe0f2" stroke="#4e8aa6" stroke-width="2"/><path d="M9 5v23M9 32h23" stroke="#e6f9ff" stroke-width="2"/><path d="M21 25v-7" stroke="#3f9a3f" stroke-width="2" stroke-linecap="round"/><path d="M21 22q-6-1-6-5 5 0 6 5m0 0q6-1 6-5-5 0-6 5" fill="#7fd05a" stroke="#3f8a3a" stroke-width="1.3" stroke-linejoin="round"/><g fill="#ff7fa8" stroke="#c24a74" stroke-width="1"><circle cx="21" cy="10.5" r="2.6"/><circle cx="17.8" cy="13" r="2.6"/><circle cx="24.2" cy="13" r="2.6"/><circle cx="19" cy="15.8" r="2.6"/><circle cx="23" cy="15.8" r="2.6"/></g><circle cx="21" cy="13.4" r="2" fill="#ffd84a" stroke="#c28a1e" stroke-width="1"/><path d="M26 29v8l3-2 3 2v-8" fill="#ff6a5c" stroke="#9a3a30" stroke-width="1.3"/></svg></button>
      <button id="home-settings" class="icon-btn h-gear" aria-label="Settings"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m16 4 8 0 1 5 4 2 5-1 4 7-4 4v3l3 4-5 6-5-2-3 2-1 4h-8l-1-5-4-2-5 1-3-7 4-3v-4l-3-4 5-6 5 2 3-2Z" fill="#fff1b7" stroke="#547c3c" stroke-width="2.2" stroke-linejoin="round"/><circle cx="20" cy="21" r="7" fill="#91be59" stroke="#547c3c" stroke-width="2"/><path d="M16 20a4 4 0 0 1 6-3" fill="none" stroke="#d8ec9e" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="h-cloud cloud-left"></div><div class="h-cloud cloud-right"></div><header class="h-brand"><h1 class="h-title"><span>Garden</span><span>doku</span></h1></header>
      <div class="h-hero"><svg class="h-board" viewBox="0 0 300 280" aria-hidden="true"><defs><polygon id="home-hex" points="0,-35 30,-17 30,17 0,35 -30,17 -30,-17" stroke-linejoin="round"/><linearGradient id="leaf" x2="0" y2="1"><stop stop-color="#bbef54"/><stop offset="1" stop-color="#78c528"/></linearGradient><linearGradient id="honey" x2="0" y2="1"><stop stop-color="#ffdb65"/><stop offset="1" stop-color="#ffa936"/></linearGradient><linearGradient id="petal" x2="0" y2="1"><stop stop-color="#ffb3d3"/><stop offset="1" stop-color="#ed77b2"/></linearGradient></defs><ellipse cx="150" cy="240" rx="87" ry="12" fill="#69824d" opacity=".09"/><g transform="translate(150 136)" font-family="Nunito, sans-serif" font-size="29" font-weight="800"><g transform="translate(-32 -55)"><use href="#home-hex" fill="#70a42a" transform="translate(0 7)"/><use href="#home-hex" fill="url(#leaf)" stroke="#d8ef9d" stroke-width="3"/><text y="10" text-anchor="middle" fill="#35581f">1</text></g><g transform="translate(32 -55)"><use href="#home-hex" fill="#70a42a" transform="translate(0 7)"/><use href="#home-hex" fill="url(#leaf)" stroke="#d8ef9d" stroke-width="3"/><text y="10" text-anchor="middle" fill="#35581f">2</text></g><g transform="translate(64 0)"><use href="#home-hex" fill="#70a42a" transform="translate(0 7)"/><use href="#home-hex" fill="url(#leaf)" stroke="#d8ef9d" stroke-width="3"/><text y="10" text-anchor="middle" fill="#35581f">3</text></g><g transform="translate(32 55)"><use href="#home-hex" fill="#d99a36" transform="translate(0 7)"/><use href="#home-hex" fill="url(#honey)" stroke="#ffe3a0" stroke-width="3"/><text y="10" text-anchor="middle" fill="#78521d">4</text></g><g transform="translate(-32 55)"><use href="#home-hex" fill="#d99a36" transform="translate(0 7)"/><use href="#home-hex" fill="url(#honey)" stroke="#ffe3a0" stroke-width="3"/><text y="10" text-anchor="middle" fill="#78521d">5</text></g><g transform="translate(-64 0)"><use href="#home-hex" fill="#d99a36" transform="translate(0 7)"/><use href="#home-hex" fill="url(#honey)" stroke="#ffe3a0" stroke-width="3"/><text y="10" text-anchor="middle" fill="#78521d">6</text></g><g transform="translate(0 0)"><use href="#home-hex" fill="#a7769f" transform="translate(0 7)"/><use href="#home-hex" fill="url(#petal)" stroke="#eac9e2" stroke-width="3"/><text y="10" text-anchor="middle" fill="#63475f">7</text></g></g><g fill="#91ad69"><path d="M38 202q-24-7-19-31 24 7 19 31Z"/><path d="M40 209q-3-24 20-28 4 21-20 28Z"/><path d="M258 78q-2-22 18-25 1 20-18 25Z"/></g><g fill="#d5b66b"><circle cx="56" cy="79" r="3"/><circle cx="253" cy="201" r="3"/></g></svg></div>
      <div class="h-actions"><button id="play-btn" class="play-btn"><span>Play</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="home-level" class="h-level" aria-label="Choose level"></button></div>
    </section>

    <!-- shop -->
    <section id="shop" class="hidden" aria-label="Garden shop">
      <header class="lv-head">
          <h2>Shop</h2>
        <div class="lv-total"><i class="coin"></i> <span id="shop-coins"></span></div>
      </header>
      <div id="shop-body" class="shop-body"></div>
    </section>

    <!-- garden album -->
    <section id="album" class="hidden" aria-label="Garden album">
      <header class="lv-head">
          <h2>Album</h2>
        <div id="album-total" class="lv-total"></div>
      </header>
      <div id="album-body" class="shop-body"></div>
    </section>

    <!-- level select -->
    <section id="levels" class="hidden" aria-label="Levels">
      <header class="lv-head">
        <button id="levels-back" class="icon-btn" aria-label="Back"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M21 7 7 20l14 13v-8h12V15H21Z" fill="#fff1b7" stroke="#547c3c" stroke-width="2.2" stroke-linejoin="round"/><path d="m18 13-8 7 8 7M22 18h8" fill="none" stroke="#fffbe0" stroke-width="2" stroke-linecap="round"/></svg></button>
        <h2>Levels</h2>
        <div id="levels-stars" class="lv-total"></div>
      </header>
      <div id="levels-grid" class="lv-grid"></div>
    </section>

    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
