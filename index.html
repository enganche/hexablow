<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#F7F1E6" />
    <title>Gardendoku</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- Shared garden artwork; portrait composition keeps the menu center clear. -->
    <svg id="bg" viewBox="0 0 600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <defs>
        <linearGradient id="garden-sky" x2="0" y2="1"><stop style="stop-color:var(--sky-a)"/><stop offset=".56" style="stop-color:var(--sky-b)"/><stop offset="1" style="stop-color:var(--sky-c)"/></linearGradient>
        <linearGradient id="garden-lawn" x2=".25" y2="1"><stop style="stop-color:var(--hill-2a)"/><stop offset="1" style="stop-color:var(--hill-2b)"/></linearGradient>
        <linearGradient id="garden-path" x2="0" y2="1"><stop stop-color="#faf0c9"/><stop offset="1" stop-color="#dcc38d"/></linearGradient>
        <radialGradient id="garden-light"><stop stop-color="#fffce1" stop-opacity=".85"/><stop offset="1" stop-color="#fffce1" stop-opacity="0"/></radialGradient>
        <g id="garden-leaf"><path d="M0 0Q-29-34-8-66Q24-49 0 0" fill="currentColor"/><path d="M0-5-7-52" stroke="#ffffff" stroke-opacity=".2" stroke-width="2" fill="none"/></g>
        <g id="garden-daisy"><path d="M0 0q-6 19-2 35" fill="none" stroke="#508649" stroke-width="3"/><path d="M-2 28q-18 0-16-13 14 0 16 13m-1-7q16-1 17-12-13 0-17 12" fill="#77a956"/><g fill="currentColor"><ellipse cy="-8" rx="5" ry="9"/><ellipse cy="-8" rx="5" ry="9" transform="rotate(72)"/><ellipse cy="-8" rx="5" ry="9" transform="rotate(144)"/><ellipse cy="-8" rx="5" ry="9" transform="rotate(216)"/><ellipse cy="-8" rx="5" ry="9" transform="rotate(288)"/></g><circle r="5" fill="#edbd53"/><circle cx="-1" cy="-1" r="2" fill="#ffe7a1"/></g>
        <g id="garden-shrub"><path d="M-70 8Q-83-19-57-29Q-48-64-15-42Q9-69 33-40Q64-48 70-16Q91 8 64 20H-50Z" fill="currentColor"/><path d="M-56-26Q-40-46-19-29M3-39Q21-49 32-28M45-22q15-6 20 8" fill="none" stroke="#ffffff" stroke-opacity=".15" stroke-width="7" stroke-linecap="round"/></g>
        <symbol id="garden-scene" viewBox="0 0 600 1000">
          <path d="M0 0H600V1000H0Z" fill="url(#garden-sky)"/>
          <ellipse cx="410" cy="220" rx="310" ry="340" fill="url(#garden-light)"/>
          <g fill="#fffdf0" opacity=".5"><path d="M-35 260q18-20 38-12 8-35 43-26 19-24 42 4 31-5 39 20 22-1 26 14Z"/><path d="M438 345q15-18 33-11 8-29 34-22 19-21 39 5 28-5 35 22 22 0 30 16H438Z"/></g>
          <path d="M0 530Q100 452 231 505T600 475V1000H0Z" style="fill:var(--hill-1)"/>
          <path d="M0 606Q158 512 340 584T600 555V1000H0Z" fill="url(#garden-lawn)"/>
          <path d="M342 565C234 632 499 680 363 779S201 900 253 1000H448C332 902 469 835 438 752S293 637 361 565" fill="url(#garden-path)" opacity=".83"/>
          <path d="M0 730Q91 674 192 722L221 1000H0Z" style="fill:var(--hill-3)" opacity=".35"/>
          <g fill="none" stroke="#fff8da" stroke-width="3" opacity=".35"><path d="m35 632 5-8m4 10 5-8m463 68 5-8m5 10 4-7M99 814l5-8m5 10 4-7"/></g>
          <g stroke="#c2b48b" stroke-width="3" fill="#fff2ce" opacity=".85"><path d="M-10 686 135 708v10L-10 696ZM-10 716l145 22v9L-10 727Z"/><path d="m14 670 7-7 7 9v82H14Zm55 8 7-7 7 9v81H69Zm55 8 7-7 7 9v78h-14Z"/></g>
          <g style="color:var(--hill-3)"><use href="#garden-shrub" transform="translate(9 790) scale(1.2)"/><use href="#garden-shrub" transform="translate(588 734) scale(1.1)"/></g>
          <g color="#8db65a"><use href="#garden-shrub" transform="translate(38 876) scale(.9)"/><use href="#garden-shrub" transform="translate(568 895)"/></g>
          <g color="#fff7d8"><use href="#garden-daisy" transform="translate(33 781) rotate(-12)"/><use href="#garden-daisy" transform="translate(82 832) scale(.7)"/><use href="#garden-daisy" transform="translate(559 814) rotate(15)"/></g>
          <g color="#eaa2a5"><use href="#garden-daisy" transform="translate(15 854) scale(1.1)"/><use href="#garden-daisy" transform="translate(586 866) scale(.8)"/></g>
          <path d="M0 946Q131 895 270 960T600 927V1000H0Z" style="fill:var(--hill-3)"/>
          <g color="#bad27b"><use href="#garden-leaf" transform="translate(25 1000) rotate(-32) scale(1.7)"/><use href="#garden-leaf" transform="translate(52 1000) rotate(24) scale(1.5)"/><use href="#garden-leaf" transform="translate(571 1000) rotate(42) scale(1.8)"/><use href="#garden-leaf" transform="translate(547 1005) rotate(-24) scale(1.3)"/></g>
          <g color="#659b57" opacity=".8"><use href="#garden-leaf" transform="translate(-8 155) rotate(154) scale(1.6)"/><use href="#garden-leaf" transform="translate(0 210) rotate(120) scale(1.2)"/><use href="#garden-leaf" transform="translate(606 91) rotate(-125) scale(1.6)"/><use href="#garden-leaf" transform="translate(609 155) rotate(-155) scale(1.1)"/></g>
          <g fill="#fff9d7" opacity=".65"><circle cx="104" cy="665" r="2"/><circle cx="510" cy="614" r="2"/><circle cx="153" cy="887" r="2.5"/><circle cx="475" cy="927" r="2"/></g>
        </symbol>
      </defs>
      <use href="#garden-scene" width="600" height="1000"/>
    </svg>

    <div id="stage">
    <div id="play-bg" aria-hidden="true"></div>
    <div id="tray-panel" aria-hidden="true"></div>
    <canvas id="game"></canvas>

    <header id="hud">
      <div class="hud-side">
        <button id="back-btn" class="icon-btn" aria-label="Back to home"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M21 7 7 20l14 13v-8h12V15H21Z" fill="#fff1b7" stroke="#547c3c" stroke-width="2.2" stroke-linejoin="round"/><path d="m18 13-8 7 8 7M22 18h8" fill="none" stroke="#fffbe0" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <div class="hud-center">
        <div id="level-name">Level 1</div>
        <div id="hearts" aria-label="Hearts left"></div>
      </div>
      <div class="hud-side right">
        <button id="settings-btn" class="icon-btn" aria-label="Settings"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m16 4 8 0 1 5 4 2 5-1 4 7-4 4v3l3 4-5 6-5-2-3 2-1 4h-8l-1-5-4-2-5 1-3-7 4-3v-4l-3-4 5-6 5 2 3-2Z" fill="#fff1b7" stroke="#547c3c" stroke-width="2.2" stroke-linejoin="round"/><circle cx="20" cy="21" r="7" fill="#91be59" stroke="#547c3c" stroke-width="2"/><path d="M16 20a4 4 0 0 1 6-3" fill="none" stroke="#d8ec9e" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>

</header>

    <!-- coin balance: only shown next to the settings button while the booster buy popup is open -->
    <div id="coin-hud" class="coin-pill hidden" aria-live="polite"><i class="coin"></i><b id="coin-count">0</b></div>

    <!-- boosters: bottom bar, under the tray scrollbar -->
    <nav id="boosters" class="hidden" aria-label="Boosters"></nav>
    <div id="boost-tip" class="hidden" role="status"></div>

    <!-- out-of-stock popup -->
    <div id="buy-pop" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="buy-title">
      <div class="buy-card"></div>
    </div>

    <!-- level 1 tutorial overlay (never blocks input) -->
    <div id="tutorial" class="hidden" aria-live="polite">
      <div id="heart-spot"></div>
      <div id="tut-from" class="tut-ring"></div>
      <div id="tut-to" class="tut-ring"></div>
      <div id="tut-hand">👆</div>
      <div id="tut-bubble">
        <svg id="tut-gardener" viewBox="0 0 88 88" aria-hidden="true" xmlns="http://www.w3.org/2000/svg">
          <circle cx="44" cy="45" r="38" style="fill:var(--ui-selected,#dcebb9)"/>
          <g stroke="#66543a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 85v-9c0-14 12-23 30-23s30 9 30 23v9" fill="#f5e6a6"/>
            <path d="m28 59 4 16h24l4-16M29 72h30v13H29Z" fill="#75a65c"/>
            <path d="M36 77h16v8H36Z" fill="#a8cb7b"/>
            <path d="M36 52v10q8 8 16 0V52" fill="#e9ad76"/>
            <ellipse cx="23" cy="40" rx="5" ry="7" fill="#f3c28c"/>
            <ellipse cx="65" cy="40" rx="5" ry="7" fill="#f3c28c"/>
            <path d="M24 28h40v16c0 15-10 20-20 20S24 59 24 44Z" fill="#f7cb96"/>
            <path d="M25 29v12l5-8m33-4v12l-5-8" fill="#f4f0dc"/>
            <path d="M31 38q4-3 7-1m12 0q4-2 7 1" fill="none" stroke="#eee9d6" stroke-width="3.5"/>
            <path d="M34 43v2m20-2v2" stroke="#514735" stroke-width="3"/>
            <path d="M39 55q5 5 10 0" fill="#b77352"/>
            <path d="M44 49c-7-6-11 0-13 3q8 5 13 0 5 5 13 0c-2-3-6-9-13-3Z" fill="#fff8e6" stroke="#c2b89a" stroke-width="1.3"/>
            <ellipse cx="44" cy="47" rx="4" ry="3" fill="#eeb37f" stroke="none"/>
            <path d="m23 25 5-16q16-9 32 0l5 16" fill="#f4ce6c"/>
            <path d="m25 19 38 0 2 8H23Z" fill="#7da557"/>
            <path d="M9 27q35-12 70 0c4 8-74 12-70 0Z" fill="#ffe39a"/>
            <path d="M59 15q-1-10 9-10 0 9-9 10Z" fill="#89b75d" stroke="#5b8145" stroke-width="1.5"/>
          </g>
        </svg>
        <p id="tut-text"></p>
      </div>
    </div>

    <!-- win / fail screen: art -> map -> action -->
    <div id="result" class="hidden" role="dialog" aria-modal="true" aria-label="Level result">
      <div id="res-confetti" aria-hidden="true"></div>
      <!-- kicker/sub text removed -->
      <div id="res-art" class="res-art"></div>
      <div id="res-map" class="res-map" aria-hidden="true"></div>
      <div id="res-actions" class="res-actions">
        <div id="res-reward" class="res-reward"></div>
        <button id="result-revive" class="claim-btn alt hidden"></button>
        <button id="result-btn" class="claim-btn"></button>
        <button id="result-home" class="res-home hidden" aria-label="Home"></button>
      </div>
      <div id="res-find" class="find-pop hidden" role="dialog" aria-label="New collectible"></div>
    </div>

    <!-- settings -->
    <div id="settings" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="settings-title">
      <div class="card st-card">
        <header class="st-banner">
          <svg class="st-leaves" viewBox="0 0 100 50" aria-hidden="true"><path d="M49 47C19 48 6 30 10 10c25-3 42 11 39 37" fill="#8cdb42"/><path d="M51 47C47 19 69 2 92 6c3 24-14 42-41 41" fill="#b2ed58"/><path d="m24 23 27 25 27-29" fill="none" stroke="#549b31" stroke-width="4" stroke-linecap="round"/></svg>
          <h2 id="settings-title">SETTINGS</h2>
        </header>
        <span class="st-bolt left" aria-hidden="true"></span><span class="st-bolt right" aria-hidden="true"></span>
        <div class="st-body"><ul class="rows"><li><span class="st-ic honey" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4zM15 8a6 6 0 0 1 0 8m3-11a10 10 0 0 1 0 14"/></svg></span><label class="st-copy" for="setting-sound"><strong>Sound</strong></label><label class="switch"><input id="setting-sound" type="checkbox" data-setting="sound" aria-label="Sound effects" /><i aria-hidden="true"></i></label></li>
<li><span class="st-ic lavender" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 17V5l11-2v12M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></svg></span><label class="st-copy" for="setting-music"><strong>Music</strong></label><label class="switch"><input id="setting-music" type="checkbox" data-setting="music" aria-label="Music" /><i aria-hidden="true"></i></label></li>
<li><span class="st-ic rose" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="7" y="4" width="10" height="16" rx="3"/><path d="M3 8v8m18-8v8M11 16h2"/></svg></span><label class="st-copy" for="setting-vibration"><strong>Vibration</strong></label><label class="switch"><input id="setting-vibration" type="checkbox" data-setting="vibration" aria-label="Vibration" /><i aria-hidden="true"></i></label></li>
<li><span class="st-ic peach" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 16h14l-2-3V9a5 5 0 0 0-10 0v4zm5 4h4M12 2v2"/></svg></span><label class="st-copy" for="setting-notifications"><strong>Notifications</strong></label><label class="switch"><input id="setting-notifications" type="checkbox" data-setting="notifications" aria-label="Notifications" /><i aria-hidden="true"></i></label></li>
<li><span class="st-ic mint" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9 17h6m-5 4h4M8 13a6 6 0 1 1 8 0l-1 4H9zM12 1V0M3 5 1 3m20 2 2-2"/></svg></span><label class="st-copy" for="setting-hints"><strong>Hints</strong></label><label class="switch"><input id="setting-hints" type="checkbox" data-setting="hints" aria-label="Helpful hints" /><i aria-hidden="true"></i></label></li></ul><button id="delete-account" type="button" class="st-danger">Delete account</button><p id="settings-note" class="note" role="status"></p></div>
        <button id="settings-close" class="st-close" aria-label="Close settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
      </div>
    </div>

    <!-- home screen -->
    <section id="home" aria-label="Gardendoku home">
      <svg class="menu-garden" viewBox="0 0 600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#garden-scene" width="600" height="1000"/></svg>
      <button id="home-shop" class="icon-btn h-gear h-shop" aria-label="Garden shop"><svg viewBox="0 0 48 48" aria-hidden="true"><defs><clipPath id="shop-awn"><path d="M6 9H42L45 21a5.25 5.25 0 0 1-10.5 0a5.25 5.25 0 0 1-10.5 0a5.25 5.25 0 0 1-10.5 0A5.25 5.25 0 0 1 3 21Z"/></clipPath></defs><path d="M8 22h32v20H8Z" fill="#fff0b8" stroke="#8a5a2a" stroke-width="2.4" stroke-linejoin="round"/><rect x="12" y="27" width="11" height="15" rx="1.5" fill="#f9b2cc" stroke="#a8466e" stroke-width="1.8"/><path d="M14 31h7" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/><path d="M17.5 40v-5" stroke="#3f8a3a" stroke-width="1.6" stroke-linecap="round"/><path d="M17.5 36q-3.5 0-3.8-3.4 3.4 0 3.8 3.4Zm0 0q3.2 0 3.6-3.2-3.4 0-3.6 3.2Z" fill="#8fd65a" stroke="#3f8a3a" stroke-width="1"/><path d="M26 42V32q0-2.6 2.6-2.6h5.8q2.6 0 2.6 2.6v10Z" fill="#c98a4b" stroke="#7d4a1f" stroke-width="1.8" stroke-linejoin="round"/><path d="M31.5 31v-4" stroke="#3f8a3a" stroke-width="1.6" stroke-linecap="round"/><path d="M31.5 28q-3.4 0-3.7-3.2 3.3 0 3.7 3.2Zm0 0q3.2 0 3.6-3-3.3 0-3.6 3Z" fill="#8fd65a" stroke="#3f8a3a" stroke-width="1"/><path d="M6 9H42L45 21a5.25 5.25 0 0 1-10.5 0a5.25 5.25 0 0 1-10.5 0a5.25 5.25 0 0 1-10.5 0A5.25 5.25 0 0 1 3 21Z" fill="#7fcf5a"/><g clip-path="url(#shop-awn)" fill="#fff8e0"><rect x="12.5" y="8" width="5.2" height="16"/><rect x="23" y="8" width="5.2" height="16"/><rect x="33.5" y="8" width="5.2" height="16"/></g><path d="M6 9H42L45 21a5.25 5.25 0 0 1-10.5 0a5.25 5.25 0 0 1-10.5 0a5.25 5.25 0 0 1-10.5 0A5.25 5.25 0 0 1 3 21Z" fill="none" stroke="#3f7d34" stroke-width="2.4" stroke-linejoin="round"/></svg></button>
      <button id="home-album" class="icon-btn h-gear h-album" aria-label="Garden album"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M7 8h25v27H7q-3-1-3-4V12q0-4 3-4Z" fill="#8a6ad8" stroke="#4e3a91" stroke-width="2"/><path d="M9 5h25v26H9Z" fill="#fff5ce" stroke="#6d5aa8" stroke-width="2"/><path d="M9 5h23v23H9Z" fill="#9fe0f2" stroke="#4e8aa6" stroke-width="2"/><path d="M9 5v23M9 32h23" stroke="#e6f9ff" stroke-width="2"/><path d="M21 25v-7" stroke="#3f9a3f" stroke-width="2" stroke-linecap="round"/><path d="M21 22q-6-1-6-5 5 0 6 5m0 0q6-1 6-5-5 0-6 5" fill="#7fd05a" stroke="#3f8a3a" stroke-width="1.3" stroke-linejoin="round"/><g fill="#ff7fa8" stroke="#c24a74" stroke-width="1"><circle cx="21" cy="10.5" r="2.6"/><circle cx="17.8" cy="13" r="2.6"/><circle cx="24.2" cy="13" r="2.6"/><circle cx="19" cy="15.8" r="2.6"/><circle cx="23" cy="15.8" r="2.6"/></g><circle cx="21" cy="13.4" r="2" fill="#ffd84a" stroke="#c28a1e" stroke-width="1"/><path d="M26 29v8l3-2 3 2v-8" fill="#ff6a5c" stroke="#9a3a30" stroke-width="1.3"/></svg></button>
      <button id="home-settings" class="icon-btn h-gear" aria-label="Settings"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="m16 4 8 0 1 5 4 2 5-1 4 7-4 4v3l3 4-5 6-5-2-3 2-1 4h-8l-1-5-4-2-5 1-3-7 4-3v-4l-3-4 5-6 5 2 3-2Z" fill="#fff1b7" stroke="#547c3c" stroke-width="2.2" stroke-linejoin="round"/><circle cx="20" cy="21" r="7" fill="#91be59" stroke="#547c3c" stroke-width="2"/><path d="M16 20a4 4 0 0 1 6-3" fill="none" stroke="#d8ec9e" stroke-width="2" stroke-linecap="round"/></svg></button>
      <div class="h-cloud cloud-left"></div><div class="h-cloud cloud-right"></div><header class="h-brand"><h1 class="h-title"><span>Garden</span><span>doku</span></h1></header>
      <div class="h-hero"><svg class="h-board" viewBox="0 0 300 280" aria-hidden="true"><defs><polygon id="home-hex" points="0,-35 30,-17 30,17 0,35 -30,17 -30,-17" stroke-linejoin="round"/><linearGradient id="leaf" x2="0" y2="1"><stop stop-color="#bbef54"/><stop offset="1" stop-color="#78c528"/></linearGradient><linearGradient id="honey" x2="0" y2="1"><stop style="stop-color:var(--tile-a,#ffdb65)"/><stop offset="1" style="stop-color:var(--tile-b,#ffa936)"/></linearGradient><linearGradient id="petal" x2="0" y2="1"><stop stop-color="#ffb3d3"/><stop offset="1" stop-color="#ed77b2"/></linearGradient></defs><ellipse cx="150" cy="240" rx="87" ry="12" fill="#69824d" opacity=".09"/><g transform="translate(150 136)" font-family="Nunito, sans-serif" font-size="29" font-weight="800"><g transform="translate(-32 -55)"><use href="#home-hex" fill="#70a42a" transform="translate(0 7)"/><use href="#home-hex" fill="url(#leaf)" stroke="#d8ef9d" stroke-width="3"/><text y="10" text-anchor="middle" fill="#35581f">1</text></g><g transform="translate(32 -55)"><use href="#home-hex" fill="#70a42a" transform="translate(0 7)"/><use href="#home-hex" fill="url(#leaf)" stroke="#d8ef9d" stroke-width="3"/><text y="10" text-anchor="middle" fill="#35581f">2</text></g><g transform="translate(64 0)"><use href="#home-hex" fill="#70a42a" transform="translate(0 7)"/><use href="#home-hex" fill="url(#leaf)" stroke="#d8ef9d" stroke-width="3"/><text y="10" text-anchor="middle" fill="#35581f">3</text></g><g transform="translate(32 55)"><use href="#home-hex" style="fill:var(--tile-base,#d99a36)" transform="translate(0 7)"/><use href="#home-hex" fill="url(#honey)" style="stroke:var(--tile-rim,#ffe3a0)" stroke-width="3"/><text y="10" text-anchor="middle" fill="#78521d">4</text></g><g transform="translate(-32 55)"><use href="#home-hex" style="fill:var(--tile-base,#d99a36)" transform="translate(0 7)"/><use href="#home-hex" fill="url(#honey)" style="stroke:var(--tile-rim,#ffe3a0)" stroke-width="3"/><text y="10" text-anchor="middle" fill="#78521d">5</text></g><g transform="translate(-64 0)"><use href="#home-hex" style="fill:var(--tile-base,#d99a36)" transform="translate(0 7)"/><use href="#home-hex" fill="url(#honey)" style="stroke:var(--tile-rim,#ffe3a0)" stroke-width="3"/><text y="10" text-anchor="middle" fill="#78521d">6</text></g><g transform="translate(0 0)"><use href="#home-hex" fill="#a7769f" transform="translate(0 7)"/><use href="#home-hex" fill="url(#petal)" stroke="#eac9e2" stroke-width="3"/><text y="10" text-anchor="middle" fill="#63475f">7</text></g></g><g fill="#91ad69"><path d="M38 202q-24-7-19-31 24 7 19 31Z"/><path d="M40 209q-3-24 20-28 4 21-20 28Z"/><path d="M258 78q-2-22 18-25 1 20-18 25Z"/></g><g fill="#d5b66b"><circle cx="56" cy="79" r="3"/><circle cx="253" cy="201" r="3"/></g></svg></div>
      <div class="h-actions"><button id="play-btn" class="play-btn"><span>Play</span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button><button id="home-level" class="h-level" aria-label="Choose level"></button></div>
    </section>

    <!-- shop -->
    <section id="shop" class="hidden" aria-label="Garden shop">
      <svg class="menu-garden" viewBox="0 0 600 1000" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><use href="#garden-scene" width="600" height="1000"/></svg>
      <header class="lv-head">
          <h2>Shop</h2>
        <div class="lv-total"><i class="coin"></i> <span id="shop-coins"></span></div>
      </header>
